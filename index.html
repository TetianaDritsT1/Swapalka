<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwapNorm DEX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }
        .wallet-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .wallet-btn:hover { background-color: #0369a1; }
        .box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input, select {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            outline: none;
        }
        input { width: 60%; }
        select {
            background-color: #334155;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .swap-btn {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .swap-btn:hover { background-color: #0369a1; }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #f43f5e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="title">SwapNorm</div>
            <button class="wallet-btn" id="connectBtn" onclick="connectWallet()">Подключить</button>
        </div>

        <div class="box">
            <div class="label">Продаете</div>
            <div class="row">
                <input type="number" id="amountIn" placeholder="0.0" value="1">
                <select id="tokenIn" onchange="updateTokens()">
                    <option value="DAI">DAI</option>
                    <option value="USDC">USDC</option>
                    <option value="USDbC">USDbC</option>
                    <option value="ETH">ETH</option>
                </select>
            </div>
        </div>

        <div class="box">
            <div class="label">Получаете (приблизительно)</div>
            <div class="row">
                <input type="text" id="amountOut" placeholder="0.0" readonly>
                <select id="tokenOut" onchange="updateTokens()">
                    <option value="USDC">USDC</option>
                    <option value="DAI">DAI</option>
                    <option value="USDbC">USDbC</option>
                    <option value="ETH">ETH</option>
                </select>
            </div>
        </div>

        <button class="swap-btn" onclick="executeSwap()">Выполнить обмен</button>
        <div class="status" id="statusMsg"></div>
    </div>

    <script>
        // Вставь сюда полный адрес твоего развернутого контракта в нижнем регистре
        const CONTRACT_ADDRESS = "0x7E797E373a141864fDF9c3C5509d3EC45B5A63E3".toLowerCase();

        const TOKEN_ADDRESSES = {
            "ETH": "0x4200000000000000000000000000000000000006".toLowerCase(),
            "USDC": "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913".toLowerCase(),
            "USDbC": "0xd9aaec86b65d86f6a7b5b1b0c42ffa531710b6ca".toLowerCase(),
            "DAI": "0x50c5725949a6f0c72e6c4a641f24049a917db0cb".toLowerCase()
        };

        const TOKEN_DECIMALS = {
            "ETH": 18,
            "USDC": 6,
            "USDbC": 6,
            "DAI": 18
        };

        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function allowance(address owner, address spender) external view returns (uint256)"
        ];

        const DEX_ABI = [
            "function executeSwap(address tokenIn, address tokenOut, uint256 amountIn, uint256 amountOutMin, bool isEthIn) external payable"
        ];

        let provider, signer, userAddress;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    document.getElementById("connectBtn").innerText = userAddress.substring(0, 6) + "..." + userAddress.substring(38);
                    document.getElementById("statusMsg").innerText = "";
                } catch (err) {
                    document.getElementById("statusMsg").innerText = "Ошибка подключения кошелька";
                }
            } else {
                alert("Установите MetaMask!");
            }
        }

        function updateTokens() {
            let tIn = document.getElementById("tokenIn").value;
            let tOut = document.getElementById("tokenOut").value;
            if (tIn === tOut) {
                document.getElementById("statusMsg").innerText = "Нельзя менять одинаковые токены!";
            } else {
                document.getElementById("statusMsg").innerText = "";
            }
        }

        async function executeSwap() {
            try {
                if (!signer) {
                    await connectWallet();
                    if (!signer) return;
                }

                let tInKey = document.getElementById("tokenIn").value;
                let tOutKey = document.getElementById("tokenOut").value;
                let amountVal = document.getElementById("amountIn").value;

                if (!amountVal || parseFloat(amountVal) <= 0) {
                    document.getElementById("statusMsg").innerText = "Введите корректную сумму";
                    return;
                }

                if (tInKey === tOutKey) {
                    document.getElementById("statusMsg").innerText = "Выберите разные токены";
                    return;
                }

                let tokenInAddr = TOKEN_ADDRESSES[tInKey];
                let tokenOutAddr = TOKEN_ADDRESSES[tOutKey];
                let decimals = TOKEN_DECIMALS[tInKey];
                let amountInWei = ethers.parseUnits(amountVal, decimals);
                let isEthIn = (tInKey === "ETH");

                document.getElementById("statusMsg").style.color = "#38bdf8";
                let dexContract = new ethers.Contract(CONTRACT_ADDRESS, DEX_ABI, signer);
                if (!isEthIn) {
                    document.getElementById("statusMsg").innerText = "Шаг 1/2: Подтверждение токенов (Approve)...";
                    let tokenContract = new ethers.Contract(tokenInAddr, ERC20_ABI, signer);
                    
                    let allowance = await tokenContract.allowance(userAddress, CONTRACT_ADDRESS);
                    if (allowance < amountInWei) {
                        let approveTx = await tokenContract.approve(CONTRACT_ADDRESS, amountInWei);
                        await approveTx.wait();
                    }
                }

                document.getElementById("statusMsg").innerText = "Шаг 2/2: Выполнение обмена...";
                let valueToSend = isEthIn ? amountInWei : 0;
                
                let tx = await dexContract.executeSwap(
                    tokenInAddr,
                    tokenOutAddr,
                    amountInWei,
                    0,
                    isEthIn,
                    { value: valueToSend }
                );

                await tx.wait();
                document.getElementById("statusMsg").style.color = "#22c55e";
                document.getElementById("statusMsg").innerText = "Успешный обмен! 🎉";

            } catch (err) {
                console.error(err);
                document.getElementById("statusMsg").style.color = "#f43f5e";
                document.getElementById("statusMsg").innerText = "Ошибка: " + (err.reason || err.message || "транзакция отклонена");
            }
        }
    </script>
</body>
</html>
